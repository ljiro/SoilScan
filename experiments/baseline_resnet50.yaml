# Experiment: ResNet-50 baseline (classification)
# Targets: N, P, K  (Low / Medium / High)
# This is the recommended starting experiment for new contributors.

name: baseline_resnet50

paths:
  checkpoint_dir: D:/SoilScan_checkpoints

data:
  targets: [n, p, k]
  task: classification
  img_size: 224
  val_split: 0.15
  test_split: 0.10
  seed: 42

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.4
  num_classes: 3

train:
  batch_size: 16        # ~3.5GB VRAM with AMP; drop to 12 if CUDA OOM occurs
  epochs: 50
  lr: 1.0e-4
  weight_decay: 5.0e-4
  num_workers: 1        # 1 worker; needs C: to have >8GB free for Windows paging file
  scheduler: cosine
  early_stopping_patience: 15
  amp: true
  label_smoothing: 0.1
